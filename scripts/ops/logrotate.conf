# logrotate de usuario (sin root), lo lanza housekeeping.sh a diario.
# copytruncate: los cron escriben con ">>" y siguen escribiendo en el mismo archivo.
/home/piojo/football-cult/scripts/*.log
/home/piojo/football-cult/scripts/*/*.log
/home/piojo/.local/state/fc-ops/*.log
{
  su piojo piojo
  size 1M
  rotate 4
  compress
  delaycompress
  copytruncate
  missingok
  notifempty
}
